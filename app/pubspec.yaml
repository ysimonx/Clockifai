name: clockifai
description: "Clockifai — suivi du temps libre et auto-hébergé (web, iOS, Android, macOS)."
publish_to: "none"
version: 0.2.9+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Backend & sync
  supabase_flutter: ^2.18.2
  powersync: ^2.4.0
  sqlite_async: ^0.14.6
  sqlite3: ^3.2.0
  drift: ^2.35.2
  drift_sqlite_async: ^0.3.1

  # App
  go_router: ^18.0.2
  get_it: ^9.3.0
  provider: ^6.1.5
  intl: ^0.20.2
  logging: ^1.3.0
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  app_links: ^7.2.2
  url_launcher: ^6.3.1
  flutter_local_notifications: ^22.3.1
  fl_chart: ^1.2.0
  file_saver: ^0.7.0
  http: ^1.4.0
  cupertino_icons: ^1.0.8
  timezone: ^0.11.2
  speech_to_text: ^7.5.0
  geolocator: ^14.1.2
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  drift_dev: ^2.35.1

flutter:
  uses-material-design: true
  generate: true
  # Identité des maquettes (plans/14-coller-aux-maquettes.md) : Geist et Geist Mono, licence OFL (assets/fonts).
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/GeistMono-SemiBold.ttf
          weight: 600
