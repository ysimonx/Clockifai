openapi: 3.1.0
info:
  title: Clockifai — services Flask
  version: 0.1.0
  summary: Ce que PostgREST et la RLS ne font pas bien — exports, factures PDF, invitations, kiosque, tâches planifiées.
  description: |
    Les **données** (entrées de temps, projets, feuilles, absences…) ne passent pas par cette API :
    l'app les lit et les écrit dans sa base locale, synchronisée par PowerSync, et les modifications
    remontent par PostgREST (`/rest/v1/`, soumis à la RLS). Voir `docs/api/README.md`.

    Cette API se connecte à Postgres en rôle `postgres` (hors RLS) : chaque route vérifie elle-même
    le JWT, l'appartenance au workspace et le rôle (`services/app/auth.py`).

    **Erreurs** : les codes 400, 401, 403, 404, 429 et 502 renvoient `{"error": "<message>"}`
    (messages en anglais, destinés au journal ou à l'affichage brut). Une erreur interne (500), par exemple
    un `workspace_id` qui n'est pas un UUID, renvoie la page HTML par défaut de Flask.

    **Rôles** du workspace : `owner`, `admin`, `manager`, `member`. « admin+ » = owner ou admin ;
    « manager+ » = owner, admin ou manager. Un chef d'équipe a le rôle `member` : son périmètre vient de
    la table `team_scope`.
servers:
  - url: https://{APP_DOMAIN}
    description: Production — Caddy transmet `/api/*` au conteneur `services` (même origine que l'app web).
    variables:
      APP_DOMAIN:
        default: clockifai.kysoe.com
        description: Domaine de l'app web de l'installation (`APP_DOMAIN` dans `deploy/.env`).
  - url: http://localhost:5050
    description: Pile locale (`make up`). CORS limité aux origines de `CORS_ORIGINS` (app web sur :3000).

tags:
  - name: santé
  - name: exports
  - name: factures
  - name: invitations
  - name: kiosque — administration
    description: Gestion des appareils de pointage, par un admin du workspace (JWT utilisateur).
  - name: kiosque — appareil
    description: Appels de la tablette, authentifiés par le jeton de l'appareil, sans compte utilisateur.
  - name: jetons personnels
    description: |
      Jetons `clk_…` d'un poste, pour les hooks Claude Code, l'extension VSCode et le serveur MCP
      (plan 10, D5). Gérés avec le JWT de l'utilisateur.
  - name: agents Claude
    description: |
      Agents retirés par un admin (plan 10, D14) : un nouveau jeton ne les recrée pas et les membres retirés ne
      descendent pas vers les appareils, d'où ces routes pour les retrouver et les restaurer (JWT, admin+).
  - name: activité
    description: |
      Événements des hooks Claude Code et de l'extension VSCode, temps des agents Claude (plan 10). Accepte
      un jeton personnel (`apiToken`) ou le JWT de l'app (`supabaseJwt` avec `workspace_id`).
  - name: plugin Claude Code
    description: |
      Marketplace Claude Code de l'instance, publique (le plugin ne contient aucun secret). Un poste l'ajoute
      par `claude plugin marketplace add https://<instance>/api/claude/marketplace.json`, puis
      `claude plugin install clockifai@clockifai` (plan 10, §6.1).
  - name: tâches planifiées
    description: |
      Déclenchement manuel. En temps normal APScheduler les exécute dans le process Flask
      (un seul worker gunicorn) : arrêt automatique toutes les `JOB_AUTOSTOP_INTERVAL_MIN` minutes
      (5 par défaut), purge chaque jour à 04:15 UTC.

security:
  - supabaseJwt: []

paths:
  /api/health:
    get:
      tags: [santé]
      operationId: health
      summary: Sonde de vie (base comprise)
      description: Exécute `select 1` si une base est configurée. Utilisée par le healthcheck Docker.
      security: []
      responses:
        "200":
          description: Service et base disponibles (ou aucune base configurée).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { status: ok, database: true }
        "503":
          description: Base injoignable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { status: degraded, database: false }

  /api/exports/report:
    get:
      tags: [exports]
      operationId: exportReport
      summary: Rapport détaillé des entrées terminées (CSV, XLSX ou PDF)
      description: |
        Entrées terminées (`end_at` non nul, non supprimées) dont le début tombe dans `[from, to]`,
        avec utilisateur, client, projet, tâche et tags. La colonne « Type » du détail vaut `humain`, ou
        `agent` pour le temps d'un agent Claude (`workspace_members.kind`). Le taux horaire d'une entrée est celui
        posé à sa saisie, sinon le taux actuel du projet, puis du membre (entrée saisie avant qu'ils aient un
        taux) ; les montants du XLSX et du PDF en découlent.

        Périmètre selon le rôle :
        - **manager+** : tout le workspace, filtres libres ;
        - **membre** : ses entrées, plus celles de son périmètre s'il est chef d'équipe (`team_scope`).
          Un `user_id` hors de ce périmètre est refusé (403).

        L'app propose aussi un export CSV calculé localement, hors ligne (« csv-local ») : il n'appelle pas
        cette route.
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdQuery"
        - name: from
          in: query
          description: "Premier jour inclus (`yyyy-MM-dd`). Défaut : 1er du mois en cours (date du serveur)."
          schema: { type: string, format: date }
        - name: to
          in: query
          description: "Dernier jour inclus (`yyyy-MM-dd`). Défaut : aujourd'hui (date du serveur)."
          schema: { type: string, format: date }
        - name: format
          in: query
          description: Format du fichier (insensible à la casse).
          schema: { type: string, enum: [csv, xlsx, pdf], default: csv }
        - name: user_id
          in: query
          description: Limiter à une personne.
          schema: { type: string, format: uuid }
        - name: project_id
          in: query
          schema: { type: string, format: uuid }
        - name: client_id
          in: query
          schema: { type: string, format: uuid }
        - name: billable
          in: query
          description: Ne garder que les entrées facturables (`true`) ou non facturables (`false`). Toute autre valeur est ignorée.
          schema: { type: string, enum: ["true", "false"] }
        - name: member_kind
          in: query
          description: |
            Ne garder que les entrées des humains (`human`) ou des agents Claude (`agent`, `workspace_members.kind`).
            Toute autre valeur est ignorée.
          schema: { type: string, enum: [human, agent] }
      responses:
        "200":
          description: |
            Fichier en pièce jointe, nommé `clockifai-<from>_<to>.<format>`.
            CSV : séparateur `;`, UTF-8 avec BOM, décimales à virgule, heures dans le fuseau du serveur ;
            colonnes Utilisateur, Email, Client, Projet, Tâche, Description, Tags, Début, Fin, Durée (h),
            Facturable, Taux horaire.
          headers:
            Content-Disposition:
              schema: { type: string }
              example: attachment; filename="clockifai-2026-10-01_2026-10-31.xlsx"
          content:
            text/csv:
              schema: { type: string }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, contentEncoding: binary }
            application/pdf:
              schema: { type: string, contentEncoding: binary }
        "400":
          description: "`workspace_id` absent, date invalide (`invalid date: …`) ou format inconnu (`format must be csv, xlsx or pdf`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Pas membre actif du workspace, ou `user_id` hors du périmètre d'un membre (`user outside your team`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/invoices/{invoice_id}/pdf:
    get:
      tags: [factures]
      operationId: invoicePdf
      summary: Facture en PDF (WeasyPrint)
      description: |
        Réservé aux **manager+**. Numéro, totaux, remise, TVA et échéance sont calculés par les triggers
        de la base (`invoices_before_write`, `invoice_items_before_write`) : le PDF ne fait que les mettre en page.
      parameters:
        - name: invoice_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/WorkspaceIdQuery"
      responses:
        "200":
          description: PDF en pièce jointe, nommé `<numéro>.pdf` (ou `brouillon-<8 premiers caractères de l'id>.pdf`).
          headers:
            Content-Disposition:
              schema: { type: string }
              example: attachment; filename="F-2026-0007.pdf"
          content:
            application/pdf:
              schema: { type: string, contentEncoding: binary }
        "400": { $ref: "#/components/responses/WorkspaceIdRequired" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Pas membre du workspace, ou rôle inférieur à manager (`manager role required`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Facture absente de ce workspace ou supprimée (`invoice not found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/invitations:
    post:
      tags: [invitations]
      operationId: invite
      summary: Inviter une personne dans le workspace (admin+)
      description: |
        - **Compte existant** : ajouté au workspace (ou réactivé s'il en était sorti), avec le rôle demandé ;
          un owner garde son rôle. `invite_link` vaut `null`.
        - **Nouveau compte** : créé par l'API admin de GoTrue (`/auth/v1/admin/generate_link`, type `invite`,
          redirection vers `APP_PUBLIC_URL`), puis ajouté au workspace. Le lien d'activation est **toujours
          renvoyé**, pour que l'admin le transmette lui-même quand aucun SMTP n'est configuré.

        Un email est envoyé dans les deux cas si un SMTP est configuré (`emailed`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationRequest" }
            example: { workspace_id: 7c0e…, email: camille@exemple.fr, role: member }
      responses:
        "201":
          description: Invitation enregistrée.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationResult" }
        "400":
          description: "`workspace_id` absent, email invalide (`valid email required`) ou rôle inconnu."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminRequired" }
        "502":
          description: "Erreur de GoTrue (`auth service error: …`), ou réponse sans identifiant d'utilisateur."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/kiosk/devices:
    post:
      tags: [kiosque — administration]
      operationId: createKioskDevice
      summary: Enregistrer un appareil de pointage (admin+)
      description: |
        Génère un jeton `kio_…` et n'en stocke que le hachage SHA-256 (`kiosk_devices.token_hash`).
        Le jeton n'est renvoyé **qu'une fois** : il se saisit ensuite sur la tablette.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace_id]
              properties:
                workspace_id: { type: string, format: uuid }
                name:
                  type: string
                  description: Nom affiché ; tronqué à 80 caractères. Défaut « Kiosque ».
      responses:
        "201":
          description: Appareil créé.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KioskDeviceCreated" }
        "400": { $ref: "#/components/responses/WorkspaceIdRequired" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminRequired" }
    get:
      tags: [kiosque — administration]
      operationId: listKioskDevices
      summary: Appareils actifs du workspace (admin+)
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdQuery"
      responses:
        "200":
          description: Appareils non révoqués, du plus ancien au plus récent.
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/KioskDevice" }
        "400": { $ref: "#/components/responses/WorkspaceIdRequired" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminRequired" }

  /api/kiosk/devices/{device_id}:
    delete:
      tags: [kiosque — administration]
      operationId: revokeKioskDevice
      summary: Révoquer un appareil (admin+)
      description: "Soft delete (`deleted_at`) : le jeton est refusé dès l'appel suivant de la tablette."
      parameters:
        - name: device_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/WorkspaceIdQuery"
      responses:
        "200":
          description: Appareil révoqué.
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: boolean, const: true }
        "400": { $ref: "#/components/responses/WorkspaceIdRequired" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminRequired" }
        "404":
          description: Appareil inconnu dans ce workspace ou déjà révoqué (`device not found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/kiosk/state:
    get:
      tags: [kiosque — appareil]
      operationId: kioskState
      summary: État affiché par la tablette
      description: |
        Workspace, membres actifs (avec leur chronomètre le plus récent en cours) et projets non archivés.
        Chaque appel met à jour `kiosk_devices.last_seen_at`. L'app l'interroge toutes les 20 secondes.
      security:
        - kioskToken: []
      responses:
        "200":
          description: État courant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KioskState" }
        "401": { $ref: "#/components/responses/KioskUnauthorized" }

  /api/kiosk/punch:
    post:
      tags: [kiosque — appareil]
      operationId: kioskPunch
      summary: Pointer l'arrivée ou le départ d'un membre par son PIN
      description: |
        Le PIN (4 à 8 chiffres, posé par le membre via la RPC `set_kiosk_pin`) est comparé au hachage bcrypt
        de `clockifai_private.member_pins`.

        - **Un chronomètre tourne** pour ce membre : départ, **tous** ses chronomètres en cours sont arrêtés
          (`action: out`, `entry_id` = le plus récent).
        - **Aucun** : arrivée, une entrée en cours est créée (`action: in`), sur `project_id` s'il est fourni
          (facturable et taux du projet), sinon sans projet (taux du membre). La limite de chronomètres
          simultanés est appliquée par le trigger de la base.

        **Anti force brute** (en mémoire, par couple appareil × membre) : au 5ᵉ PIN faux, blocage de 5 minutes
        (429) ; tant qu'aucun PIN correct n'a été saisi, chaque nouvel échec rebloque 5 minutes.
        Le compteur repart de zéro au redémarrage du service.
      security:
        - kioskToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PunchRequest" }
      responses:
        "200":
          description: Pointage enregistré.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PunchResult" }
        "400":
          description: "`user_id and pin are required`, ou `unknown project` (projet absent du workspace)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/KioskUnauthorized" }
        "403":
          description: PIN faux, membre inactif ou sans PIN (`wrong PIN`) — compte comme un échec.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Trop d'échecs pour ce membre sur cet appareil (`too many attempts, try again later`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/tokens:
    post:
      tags: [jetons personnels]
      operationId: createApiToken
      summary: Créer un jeton personnel pour un poste
      description: |
        Génère un jeton `clk_` + 32 caractères hexadécimaux et n'en stocke que le hachage SHA-256
        (`clockifai_private.api_tokens`). Le jeton n'est renvoyé **qu'une fois**. Crée aussi, s'il manque,
        l'agent Claude du pilote dans ce workspace (compte technique sans connexion possible) ; un agent
        désactivé ou retiré par un admin n'est jamais réactivé.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace_id]
              properties:
                workspace_id: { type: string, format: uuid }
                name:
                  type: string
                  description: Nom du poste ; tronqué à 80 caractères. Défaut « Poste ».
      responses:
        "201":
          description: Jeton créé.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiTokenCreated" }
        "400": { $ref: "#/components/responses/WorkspaceIdRequired" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/MemberRequired" }
        "502":
          description: "Supabase Auth a refusé la création du compte de l'agent (`auth service error: …`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [jetons personnels]
      operationId: listApiTokens
      summary: Jetons actifs (les siens ; tous ceux du workspace pour un admin+)
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdQuery"
      responses:
        "200":
          description: Jetons non révoqués, du plus ancien au plus récent.
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items: { $ref: "#/components/schemas/ApiToken" }
        "400": { $ref: "#/components/responses/WorkspaceIdRequired" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/MemberRequired" }

  /api/tokens/{token_id}:
    delete:
      tags: [jetons personnels]
      operationId: revokeApiToken
      summary: Révoquer un jeton (le sien ; n'importe lequel du workspace pour un admin+)
      parameters:
        - name: token_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/WorkspaceIdQuery"
      responses:
        "200":
          description: Jeton révoqué ; refusé dès l'appel suivant.
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: boolean, const: true }
        "400": { $ref: "#/components/responses/WorkspaceIdRequired" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/MemberRequired" }
        "404":
          description: Jeton inconnu, déjà révoqué, ou d'un autre membre (`token not found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/agents/removed:
    get:
      tags: [agents Claude]
      operationId: listRemovedAgents
      summary: Agents retirés dont le pilote est encore membre (admin+)
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdQuery"
      responses:
        "200":
          description: Du plus récemment retiré au plus ancien.
          content:
            application/json:
              schema:
                type: object
                required: [agents]
                properties:
                  agents:
                    type: array
                    items:
                      type: object
                      required: [user_id, display_name, pilot_id, pilot_name, removed_at]
                      properties:
                        user_id: { type: string, format: uuid }
                        display_name: { type: string }
                        pilot_id: { type: string, format: uuid }
                        pilot_name: { type: [string, "null"] }
                        removed_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/WorkspaceIdRequired" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminRequired" }

  /api/agents/{agent_id}/restore:
    post:
      tags: [agents Claude]
      operationId: restoreAgent
      summary: Restaurer un agent retiré (admin+)
      description: |
        Annule le retrait (`deleted_at` remis à nul) et aligne le statut de l'agent sur celui de son pilote.
        Les triggers recalculent `team_scope` : le pilote et ses chefs d'équipe revoient son temps, et les
        sessions Claude Code du pilote produisent de nouveau des entrées. Les entrées passées sont intactes.
      parameters:
        - name: agent_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace_id]
              properties:
                workspace_id: { type: string, format: uuid }
      responses:
        "200":
          description: Agent restauré.
          content:
            application/json:
              schema:
                type: object
                required: [agent_id, status]
                properties:
                  agent_id: { type: string, format: uuid }
                  status: { type: string, enum: [active, inactive], description: Celui du pilote. }
        "400": { $ref: "#/components/responses/WorkspaceIdRequired" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminRequired" }
        "404":
          description: Pas un agent retiré de ce workspace, ou pilote lui-même retiré (`removed agent not found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/activity/events:
    post:
      tags: [activité]
      operationId: postActivityEvents
      summary: Recevoir un lot d'événements (hooks, extension)
      description: |
        Au plus 200 événements, enregistrés dans `clockifai_private.activity_events` (idempotence par `id`).
        Un événement daté de plus de 7 jours ou de plus de 5 minutes dans le futur est refusé, comme un `kind`
        inconnu, un événement d'agent sans `session_id` ou un `agent_usage` sans modèle ou aux compteurs qui ne
        sont pas des entiers positifs ; les autres sont acceptés.

        Pour chaque session d'agent du lot, le chronomètre (plan 10, D7) recalcule les entrées de l'agent
        Claude du pilote à partir des événements de la session, et les écrit par `agent_entry_write`. Les
        commits revendiqués par la session sont rattachés à son entrée. L'usage IA (`agent_usage`, D17) est
        cumulé dans `public.agent_usage` pour l'entrée qui couvre son heure, par modèle, effort et vitesse, avec
        un coût estimé au tarif de `public.ai_model_prices`. Rien n'est écrit pour un agent désactivé ou retiré.
      security:
        - apiToken: []
        - supabaseJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                workspace_id:
                  type: string
                  format: uuid
                  description: Avec un JWT seulement ; un jeton porte son workspace.
                events:
                  type: array
                  maxItems: 200
                  items: { $ref: "#/components/schemas/ActivityEvent" }
      responses:
        "202":
          description: Lot traité.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityEventsResult" }
        "400":
          description: "`events must be a list`, `at most 200 events per request`, ou `workspace_id is required` (JWT)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/TokenUnauthorized" }
        "403": { $ref: "#/components/responses/MemberRequired" }

  /api/activity/today:
    get:
      tags: [activité]
      operationId: activityToday
      summary: Mon temps, celui de Claude et la durée calendaire aujourd'hui
      description: |
        Journée dans le fuseau du profil. « Mon temps » = mes entrées ; « Claude » = celles de mon agent ;
        durée calendaire = union des deux. Sert à la barre d'état de l'extension VSCode et au MCP.
      security:
        - apiToken: []
        - supabaseJwt: []
      parameters:
        - name: workspace_id
          in: query
          required: false
          description: Avec un JWT seulement.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Résumé du jour.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityToday" }
        "400": { $ref: "#/components/responses/WorkspaceIdRequired" }
        "401": { $ref: "#/components/responses/TokenUnauthorized" }
        "403": { $ref: "#/components/responses/MemberRequired" }

  /api/activity/projects:
    get:
      tags: [activité]
      operationId: activityProjects
      summary: Projets actifs et leurs tâches actives
      description: Pour choisir le projet d'un dépôt depuis l'extension VSCode ou le MCP.
      security:
        - apiToken: []
        - supabaseJwt: []
      parameters:
        - name: workspace_id
          in: query
          required: false
          description: Avec un JWT seulement.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Projets non archivés, par nom.
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items: { $ref: "#/components/schemas/ActivityProject" }
        "400": { $ref: "#/components/responses/WorkspaceIdRequired" }
        "401": { $ref: "#/components/responses/TokenUnauthorized" }
        "403": { $ref: "#/components/responses/MemberRequired" }

  /api/activity/rules:
    post:
      tags: [activité]
      operationId: createActivityRule
      summary: Rattacher un dépôt ou un dossier à un projet
      description: |
        Crée une règle personnelle (`activity_rules`) : un dépôt (`remote_key`), un préfixe de chemin, ou le
        dépôt d'une entrée de mon agent (`time_entry_id`). Les entrées de mon agent sans projet de ce dépôt ou
        de ce dossier, sur 7 jours, reçoivent le projet (facturable et taux recalculés).
      security:
        - apiToken: []
        - supabaseJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivityRuleRequest" }
      responses:
        "201":
          description: Règle créée.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityRuleResult" }
        "400":
          description: "`project_id is required`, `unknown project`, `unknown task for this project`, ou cible manquante."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/TokenUnauthorized" }
        "403": { $ref: "#/components/responses/MemberRequired" }
        "404":
          description: "`time_entry_id` qui n'est pas une entrée de mon agent, ou sans dépôt connu."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/jobs/auto-stop:
    post:
      tags: [tâches planifiées]
      operationId: jobAutoStop
      summary: Arrêter les chronomètres trop longs du workspace (admin+)
      description: |
        Arrête les chronomètres qui dépassent `workspaces.auto_stop_after_hours` (0 = désactivé).
        L'entrée est close à `start_at + limite`, pas à l'heure de l'appel.
        `workspace_id` peut être passé en paramètre ou dans le corps JSON.
      parameters:
        - name: workspace_id
          in: query
          description: Workspace visé (ou champ `workspace_id` du corps JSON).
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                workspace_id: { type: string, format: uuid }
      responses:
        "200":
          description: Nombre de chronomètres arrêtés.
          content:
            application/json:
              schema:
                type: object
                required: [stopped]
                properties:
                  stopped: { type: integer, minimum: 0 }
        "400": { $ref: "#/components/responses/WorkspaceIdRequired" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminRequired" }

  /api/claude/marketplace.json:
    get:
      tags: [plugin Claude Code]
      operationId: claudeMarketplace
      summary: Marketplace « clockifai » de l'instance
      description: |
        Référence l'archive du plugin par une source `archive` : son adresse (protocole et hôte de la requête,
        tels que transmis par Caddy) et son empreinte SHA-256. Claude Code exige une archive servie en HTTPS ;
        l'empreinte sert de version du plugin, donc un plugin modifié par une mise à jour est proposé aux postes.
      security: []
      responses:
        "200":
          description: Marketplace Claude Code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClaudeMarketplace" }
              example:
                name: clockifai
                owner: { name: Clockifai }
                description: Plugin Clockifai de cette instance
                plugins:
                  - name: clockifai
                    description: "Temps de Claude Code dans Clockifai : un chronomètre par session…"
                    source:
                      source: archive
                      url: https://clockifai.example.com/api/claude/clockifai-plugin.zip
                      sha256: 6bfa50e3d2e00c052b46abe51fff89346ac803e45771f76dcf6df1ab74cca5e1
        "400":
          description: "En-tête `Host` invalide (`invalid host`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Fichiers du plugin absents de l'image (`plugin not available on this instance`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/claude/clockifai-plugin.zip:
    get:
      tags: [plugin Claude Code]
      operationId: claudePluginArchive
      summary: Archive du plugin clockifai
      description: |
        Zip reproductible de `integrations/claude-code/` (manifeste, hooks, script), l'adresse de l'instance
        posée comme valeur par défaut de `userConfig.url`.
      security: []
      responses:
        "200":
          description: Archive zip du plugin.
          content:
            application/zip:
              schema: { type: string, format: binary }
        "400":
          description: "En-tête `Host` invalide (`invalid host`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Fichiers du plugin absents de l'image.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/jobs/purge-deleted:
    post:
      tags: [tâches planifiées]
      operationId: jobPurgeDeleted
      summary: Purger les lignes supprimées depuis plus de 30 jours (rôle service)
      description: |
        Supprime physiquement les lignes soft-deleted depuis plus de 30 jours (`time_entries`, `tasks`,
        `projects`, `clients`, `tags`, `workspace_members`, `workspaces`), tous workspaces confondus.
        L'appel manuel purge toujours à 30 jours ; la tâche planifiée suit `JOB_PURGE_DELETED_AFTER_DAYS`.

        Exige un JWT dont le claim `role` vaut `service_role`, **et** qui porte `sub` et
        `aud: authenticated` (contrôles communs de `require_user`). La clé `SERVICE_ROLE_KEY` standard de
        Supabase n'a ni `sub` ni `aud` : elle est refusée en 401.
      responses:
        "200":
          description: Nombre de lignes supprimées.
          content:
            application/json:
              schema:
                type: object
                required: [purged]
                properties:
                  purged: { type: integer, minimum: 0 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "JWT valide mais sans `role: service_role` (`service role required`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    supabaseJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <access_token>` de la session Supabase de l'utilisateur.
        Vérifié avec `SUPABASE_JWT_SECRET` (HS256) ou, s'il est vide, avec le JWKS de GoTrue
        (ES256 / RS256 / EdDSA). Claims exigés : `exp`, `sub`, `aud = authenticated`.
    apiToken:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer clk_…` : jeton personnel d'un poste (`POST /api/tokens`). Il porte son workspace ;
        refusé s'il est révoqué ou si son propriétaire n'est plus membre actif du workspace.
    kioskToken:
      type: apiKey
      in: header
      name: X-Kiosk-Token
      description: Jeton `kio_…` d'un appareil non révoqué, obtenu par `POST /api/kiosk/devices`.

  parameters:
    WorkspaceIdQuery:
      name: workspace_id
      in: query
      required: true
      description: |
        Workspace visé. L'utilisateur doit en être membre actif. Lu dans la chaîne de requête, ou à défaut
        dans le corps JSON.
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: "En-tête absent (`missing bearer token`), ou JWT invalide ou expiré (`invalid token: …`)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    WorkspaceIdRequired:
      description: "`workspace_id is required`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AdminRequired:
      description: Pas membre actif du workspace (`not a member of this workspace`), ou rôle inférieur à admin (`admin role required`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MemberRequired:
      description: Pas membre actif du workspace (`not a member of this workspace`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TokenUnauthorized:
      description: "En-tête absent, JWT invalide, ou jeton `clk_…` inconnu, révoqué ou d'un ancien membre (`invalid or revoked token`)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    KioskUnauthorized:
      description: "`missing kiosk token`, ou jeton inconnu ou révoqué (`invalid kiosk token`)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    ClaudeMarketplace:
      type: object
      required: [name, owner, plugins]
      properties:
        name: { type: string, const: clockifai }
        owner:
          type: object
          required: [name]
          properties:
            name: { type: string }
        description: { type: string }
        plugins:
          type: array
          items:
            type: object
            required: [name, source]
            properties:
              name: { type: string }
              description: { type: string }
              source:
                type: object
                required: [source, url, sha256]
                properties:
                  source: { type: string, const: archive }
                  url: { type: string, format: uri }
                  sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, examples: ["workspace_id is required"] }

    Health:
      type: object
      required: [status, database]
      properties:
        status: { type: string, enum: [ok, degraded] }
        database: { type: boolean }

    InvitationRequest:
      type: object
      required: [workspace_id, email]
      properties:
        workspace_id: { type: string, format: uuid }
        email:
          type: string
          description: Mis en minuscules ; doit contenir `@`.
        role:
          type: string
          enum: [member, manager, admin]
          default: member
        display_name:
          type: string
          description: "Nom affiché d'un nouveau compte. Défaut : partie de l'email avant `@`."

    InvitationResult:
      type: object
      required: [user_id, created, emailed, invite_link]
      properties:
        user_id: { type: string, format: uuid }
        created:
          type: boolean
          description: Vrai si le compte vient d'être créé.
        emailed:
          type: boolean
          description: Vrai si un email est parti (faux sans SMTP configuré).
        invite_link:
          type: [string, "null"]
          description: Lien d'activation d'un nouveau compte ; `null` pour un compte existant.

    KioskDevice:
      type: object
      required: [id, name, created_at, last_seen_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        created_at:
          type: string
          description: Date HTTP (RFC 1123, sérialisation par défaut de Flask), ex. `Fri, 23 Oct 2026 08:12:00 GMT`.
        last_seen_at:
          type: [string, "null"]
          description: Dernier appel de l'appareil, même format que `created_at`.

    KioskDeviceCreated:
      type: object
      required: [id, name, token]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        token:
          type: string
          description: Jeton à saisir sur la tablette ; non récupérable ensuite.
          examples: ["kio_3q2…"]

    KioskState:
      type: object
      required: [workspace, members, projects]
      properties:
        workspace:
          type: [object, "null"]
          properties:
            name: { type: string }
            currency: { type: string, examples: [EUR] }
        members:
          type: array
          description: Membres actifs, par nom affiché.
          items:
            type: object
            required: [user_id, display_name, has_pin, running_since, running_project]
            properties:
              user_id: { type: string, format: uuid }
              display_name: { type: string }
              has_pin: { type: boolean }
              running_since:
                type: [string, "null"]
                format: date-time
                description: Début (ISO 8601) du chronomètre en cours le plus récent.
              running_project: { type: [string, "null"] }
        projects:
          type: array
          description: Projets non archivés, par nom.
          items:
            type: object
            required: [id, name, color]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              color: { type: [string, "null"] }

    PunchRequest:
      type: object
      required: [user_id, pin]
      properties:
        user_id: { type: string, format: uuid }
        pin: { type: string, pattern: "^[0-9]{4,8}$" }
        project_id:
          type: [string, "null"]
          format: uuid
          description: Projet de l'arrivée ; ignoré au départ.

    PunchResult:
      type: object
      required: [action, entry_id]
      properties:
        action:
          type: string
          enum: [in, out]
          description: "`in` : arrivée (entrée créée) ; `out` : départ (chronomètres arrêtés)."
        entry_id: { type: string, format: uuid }

    ApiTokenCreated:
      type: object
      required: [id, name, token, agent_id]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        token:
          type: string
          description: À coller dans la configuration du plugin Claude Code et de l'extension VSCode ; non récupérable ensuite.
          examples: ["clk_9f86d081884c7d659a2feaa0c55ad015"]
        agent_id:
          type: string
          format: uuid
          description: Utilisateur de l'agent Claude du pilote (« Claude · <nom> »).

    ApiToken:
      type: object
      required: [id, name, user_id, user_name, created_at, last_used_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        user_id: { type: string, format: uuid }
        user_name: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }

    ActivityEvent:
      type: object
      required: [id, kind, occurred_at]
      properties:
        id:
          type: string
          format: uuid
          description: Clé d'idempotence (uuid4 du hook, ou uuid5(remote_key, sha) pour un commit).
        kind:
          type: string
          enum: [prompt, agent_tool, agent_stop, agent_wait, session_start, session_end, session_task,
                 session_description, agent_usage, focus_start, focus_alive, focus_end, edit, terminal, commit,
                 presence]
        occurred_at: { type: string, format: date-time, description: "Avec fuseau (ex. `Z`)." }
        session_id: { type: string, description: Requis pour un événement d'agent. }
        window_id: { type: string, description: Fenêtre VSCode (extension). }
        remote_key: { type: string, description: "URL distante normalisée (`hôte/chemin`), ou `local:<dossier>`." }
        cwd: { type: string }
        git_branch: { type: string }
        sha: { type: string }
        subject: { type: string, description: Première ligne du message de commit (200 caractères). }
        author_email: { type: string }
        authored_at: { type: string, format: date-time }
        duration_ms: { type: integer, minimum: 0, description: "`agent_tool` : durée de l'outil." }
        payload:
          type: object
          description: "`session_task` : `{task_name}` (nom donné par Claude, 80 caractères : tâche reprise ou créée dans le projet de l'entrée) ou `{task_id, project_id}` ; `session_description` : `{description}` ; `agent_usage` : `{model, effort, speed, requests, input_tokens, output_tokens, cache_write_5m_tokens, cache_write_1h_tokens, cache_read_tokens}` (totaux d'une tranche de 5 minutes de la transcription, entiers positifs ; `effort` et `speed` facultatifs, `speed` vaut `standard` par défaut). 2000 caractères JSON au plus."
        editor: { type: string }
        machine: { type: string }
        active: { type: boolean }
        excerpt: { type: string }

    ActivityEventsResult:
      type: object
      required: [accepted, duplicates, rejected]
      properties:
        accepted: { type: integer, minimum: 0, description: Nouveaux événements enregistrés. }
        duplicates: { type: integer, minimum: 0, description: Événements valides déjà reçus. }
        rejected:
          type: array
          items:
            type: object
            required: [index, reason]
            properties:
              index: { type: integer }
              reason: { type: string }

    ActivityToday:
      type: object
      required: [day, my_seconds, claude_seconds, calendar_seconds, agent_id, projects, running]
      properties:
        day: { type: string, format: date }
        my_seconds: { type: integer }
        claude_seconds: { type: integer }
        calendar_seconds: { type: integer, description: Union de mon temps et de celui de Claude. }
        agent_id: { type: [string, "null"], format: uuid }
        projects:
          type: array
          items:
            type: object
            required: [project_id, name, my_seconds, claude_seconds]
            properties:
              project_id: { type: [string, "null"], format: uuid }
              name: { type: [string, "null"] }
              my_seconds: { type: integer }
              claude_seconds: { type: integer }
        running:
          type: array
          description: Entrées de mon agent en cours (une par session active).
          items:
            type: object
            required: [entry_id, project_id, project_name, repository, since]
            properties:
              entry_id: { type: string, format: uuid }
              project_id: { type: [string, "null"], format: uuid }
              project_name: { type: [string, "null"] }
              repository: { type: [string, "null"] }
              since: { type: string, format: date-time }

    ActivityProject:
      type: object
      required: [id, name, color, client_name, tasks]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: [string, "null"] }
        client_name: { type: [string, "null"] }
        tasks:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }

    ActivityRuleRequest:
      type: object
      required: [project_id]
      properties:
        workspace_id: { type: string, format: uuid, description: Avec un JWT seulement. }
        project_id: { type: string, format: uuid }
        task_id: { type: [string, "null"], format: uuid }
        remote_key: { type: string, description: "Dépôt (`hôte/chemin`)." }
        path_prefix: { type: string, description: "Dossier ; prime sur une règle de dépôt." }
        time_entry_id: { type: string, format: uuid, description: "Une entrée de mon agent, dont on prend le dépôt." }

    ActivityRuleResult:
      type: object
      required: [id, match_kind, pattern, reattributed]
      properties:
        id: { type: string, format: uuid }
        match_kind: { type: string, enum: [repo, path_prefix] }
        pattern: { type: string }
        reattributed: { type: integer, description: Entrées de mon agent qui ont reçu le projet. }
